<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP Resource Monitor & Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">Android Real-Time Monitor</h1>
        <p class="text-sm text-slate-400">Pemantauan Sumber Daya & Task Manager via ADB</p>
      </div>
      <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40">
        Terputus
      </div>
    </div>

    <!-- Grid Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- RAM -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-medium text-slate-400">Penggunaan RAM</span>
          <span id="ram-percent" class="text-xs px-2 py-0.5 bg-sky-500/20 text-sky-300 rounded font-bold">0%</span>
        </div>
        <div class="text-3xl font-extrabold text-sky-400 mb-3">
          <span id="ram-used">0</span> <span class="text-base text-slate-400 font-normal">/ <span id="ram-total">0</span> MB</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div id="ram-bar" class="bg-sky-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="mt-3 text-xs text-slate-400">Bebas: <span id="ram-free" class="text-slate-200">0 MB</span></div>
      </div>

      <!-- Storage -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-medium text-slate-400">Memori Internal</span>
          <span id="storage-percent" class="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded font-bold">0%</span>
        </div>
        <div class="text-3xl font-extrabold text-indigo-400 mb-3">
          <span id="storage-used">0</span> <span class="text-base text-slate-400 font-normal">/ <span id="storage-total">0</span> GB</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div id="storage-bar" class="bg-indigo-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="mt-3 text-xs text-slate-400">Sisa: <span id="storage-free" class="text-slate-200">0 GB</span></div>
      </div>

      <!-- Battery -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-medium text-slate-400">Status Perangkat</span>
          <span id="temp-badge" class="text-xs px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded font-bold">0 °C</span>
        </div>
        <div class="text-3xl font-extrabold text-emerald-400 mb-3"><span id="bat-level">0</span>%</div>
        <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div id="bat-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="mt-3 text-xs text-slate-400">Suhu: <span id="bat-temp" class="text-slate-200">0 °C</span></div>
      </div>
    </div>

    <!-- Task Manager Table -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200 mb-4">Aplikasi Aktif (Task Manager)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/50 text-xs uppercase text-slate-400">
            <tr>
              <th class="px-4 py-3">Nama Paket Aplikasi</th>
              <th class="px-4 py-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="app-list" class="divide-y divide-slate-700">
            <tr>
              <td colspan="2" class="px-4 py-4 text-center text-slate-500">Memindai aplikasi...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const socket = io();

    function setSafeText(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text;
    }

    function setSafeWidth(id, percent) {
      const el = document.getElementById(id);
      if (el) el.style.width = percent + '%';
    }

    socket.on('metrics', (data) => {
      const badge = document.getElementById('status-badge');
      if (!data.connected) {
        if (badge) {
          badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40";
          badge.innerText = "HP Tidak Terdeteksi / USB Disconnected";
        }
        return;
      }

      if (badge) {
        badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
        badge.innerText = "Terhubung (Live)";
      }

      // RAM
      setSafeText('ram-used', data.ram.used);
      setSafeText('ram-total', data.ram.total);
      setSafeText('ram-free', data.ram.free + " MB");
      setSafeText('ram-percent', data.ram.percent + "%");
      setSafeWidth('ram-bar', data.ram.percent);

      // Storage
      setSafeText('storage-used', data.storage.used);
      setSafeText('storage-total', data.storage.total);
      setSafeText('storage-free', data.storage.free + " GB");
      setSafeText('storage-percent', data.storage.percent + "%");
      setSafeWidth('storage-bar', data.storage.percent);

      // Battery & Temp
      setSafeText('bat-level', data.battery.level);
      setSafeText('bat-temp', data.battery.temp + " °C");
      setSafeText('temp-badge', data.battery.temp + " °C");
      setSafeWidth('bat-bar', data.battery.level);

      // App List
      const appListEl = document.getElementById('app-list');
      if (appListEl) {
        if (data.apps && data.apps.length > 0) {
          appListEl.innerHTML = data.apps.map(app => `
            <tr class="hover:bg-slate-700/30">
              <td class="px-4 py-3 font-mono text-xs text-sky-300">${app.packageName}</td>
              <td class="px-4 py-3 text-right">
                <button onclick="forceStop('${app.packageName}')" class="px-3 py-1 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 rounded text-xs font-semibold transition-all">
                  Force Stop
                </button>
              </td>
            </tr>
          `).join('');
        } else {
          appListEl.innerHTML = `<tr><td colspan="2" class="px-4 py-4 text-center text-slate-500">Tidak ada aplikasi pihak ketiga yang aktif di latar depan</td></tr>`;
        }
      }
    });

    async function forceStop(packageName) {
      if (!confirm(`Hentikan aplikasi ${packageName}?`)) return;
      try {
        const res = await fetch('/api/force-stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ packageName })
        });
        const result = await res.json();
        alert(result.message);
      } catch (err) {
        alert('Gagal mengirim perintah force-stop.');
      }
    }
  </script>
</body>
</html>
